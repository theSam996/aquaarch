<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - AquaArch</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="auth-container">
        <a href="index.html" class="back-link">
            <i data-lucide="arrow-left" style="width:16px;"></i> Back to Home
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <h2 class="auth-title">Register</h2>
            </div>

            <div id="auth-error"
                style="color: #EF4444; margin-bottom: 1rem; font-size: 0.9rem; text-align: center; display: none;">
            </div>

            <button id="google-signup-btn" class="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
                Sign in with Google
            </button>

            <div class="auth-divider">
                <span>or Sign up with Email</span>
            </div>

            <form id="signup-form">
                <div class="input-group">
                    <label class="input-label">Email</label>
                    <input type="email" id="email" class="input-field" placeholder="mail@website.com" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Password</label>
                    <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Confirm Password</label>
                    <input type="password" id="confirm-password" class="input-field" placeholder="••••••••" required>
                </div>

                <div class="flex mb-6" style="font-size: 0.875rem; margin-bottom: 1.5rem;">
                    <label class="flex items-center cursor-pointer" style="color: var(--text-secondary);">
                        <input type="checkbox" style="margin-right: 0.5rem; accent-color: var(--accent-primary);"
                            required>
                        I agree to Terms & Conditions
                    </label>
                </div>

                <button type="submit" id="signup-submit-btn" class="btn btn-primary w-full">Sign Up</button>
            </form>

            <div class="form-footer">
                Already registered? <a href="login.html">Log in to your account</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './script.js';
        import { createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        lucide.createIcons();

        const signupForm = document.getElementById('signup-form');
        const googleBtn = document.getElementById('google-signup-btn');
        const errorDiv = document.getElementById('auth-error');
        const submitBtn = document.getElementById('signup-submit-btn');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            errorDiv.style.display = 'none';

            if (password !== confirmPassword) {
                errorDiv.innerText = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            submitBtn.innerText = 'Creating Account...';
            submitBtn.disabled = true;

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorDiv.innerText = 'Failed to create account: ' + err.message;
                errorDiv.style.display = 'block';
                submitBtn.innerText = 'Sign Up';
                submitBtn.disabled = false;
            }
        });

        googleBtn.addEventListener('click', async () => {
            try {
                errorDiv.style.display = 'none';
                if (!auth) {
                    throw new Error("Authentication failed to initialize. Is the backend server running?");
                }
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorDiv.innerText = 'Failed to sign in with Google: ' + err.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
