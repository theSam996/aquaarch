<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Orders - AquaArch</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <nav class="navbar">
        <div class="container flex justify-between items-center h-full">
            <a href="index.html" class="brand">Aqua<span class="accent-text">Arch</span></a>
            <div class="nav-links md-flex">
                <a href="index.html#features">Features</a>
                <a href="index.html#about">About</a>
                <a href="index.html#products">Products</a>
            </div>
            <div class="nav-actions md-flex">
                <div class="user-link flex items-center gap-4" style="display: none;">
                    <a href="orders.html" class="text-sm font-medium" style="color:white; margin-right:15px;">Orders</a>
                    <a href="dashboard.html" class="text-sm font-medium"
                        style="color:white; margin-right:15px;">Dashboard</a>
                    <button class="btn btn-outline small logout-btn">Log Out</button>
                </div>
            </div>
            <div class="md-hidden">
                <button class="mobile-toggle"><i data-lucide="menu" color="white"></i></button>
            </div>
        </div>
        <div class="mobile-menu">
            <div class="container flex flex-col gap-4">
                <a href="dashboard.html">Dashboard</a>
                <button class="btn btn-outline w-full logout-btn">Log Out</button>
            </div>
        </div>
    </nav>

    <div class="container orders-container">
        <!-- Orders will be loaded here via script.js -->
        <div style="text-align:center; padding-top: 5rem; color: #888;">
            <p>Loading your orders...</p>
        </div>
    </div>

    <footer
        style="padding: 4rem 0; border-top: 1px solid var(--glass-border); background: var(--bg-secondary); margin-top: auto;">
        <div class="container">
            <div class="flex flex-col md-flex-row justify-between items-start gap-8" style="width: 100%;">

                <!-- Left: Brand -->
                <div style="flex: 1; text-align: left;">
                    <a href="index.html" style="font-size: 1.5rem; font-weight: bold;">
                        Aqua<span class="accent-text">Arch</span>
                    </a>
                    <p style="margin-top: 0.5rem; max-width: 300px;">
                        Sustainable steps towards a healthier planet.
                    </p>
                </div>

                <!-- Middle: Product -->
                <div class="flex flex-col gap-2" style="flex: 1; align-items: center; text-align: center;">
                    <h4 style="font-size: 0.9rem; color: white;">Product</h4>
                    <a href="index.html#features" style="font-size: 0.9rem; color: var(--text-secondary);">Features</a>
                    <a href="index.html#how-it-works" style="font-size: 0.9rem; color: var(--text-secondary);">How it
                        Works</a>
                </div>

                <!-- Right: Company -->
                <div class="flex flex-col gap-2" style="flex: 1; align-items: flex-end; text-align: right;">
                    <h4 style="font-size: 0.9rem; color: white;">Company</h4>
                    <a href="index.html#about" style="font-size: 0.9rem; color: var(--text-secondary);">About</a>
                    <a href="index.html#founders" style="font-size: 0.9rem; color: var(--text-secondary);">Contact</a>
                </div>
            </div>

            <div
                style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--glass-border); text-align: center; font-size: 0.85rem; color: var(--text-muted);">
                &copy; 2026 AquaArch. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
